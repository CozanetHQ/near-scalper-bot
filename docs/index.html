<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CozanetHQ — Multi-Pair Scalper Terminal</title>
<style>
  :root{
    --bg:#0a0e14; --panel:#111722; --panel2:#0d1320; --line:#1c2636;
    --txt:#dbe4f0; --dim:#6b7a90; --acc:#f0b90b; --up:#16c784; --dn:#ea3943;
    --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;padding:18px}
  .mono{font-family:var(--mono)}
  a{color:var(--acc);text-decoration:none}
  header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  h1{font-size:17px;letter-spacing:.04em;font-weight:600}
  h1 span{color:var(--dim);font-weight:400;font-size:12px;letter-spacing:.08em}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.05em}
  .pill.live{background:rgba(22,199,132,.12);color:var(--up);border:1px solid rgba(22,199,132,.35)}
  .pill.dead{background:rgba(234,57,67,.12);color:var(--dn);border:1px solid rgba(234,57,67,.35)}
  .pill.wait{background:rgba(240,185,11,.10);color:var(--acc);border:1px solid rgba(240,185,11,.3)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .tile .k{font-size:10.5px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase}
  .tile .v{font-size:19px;font-weight:600;margin-top:4px;font-family:var(--mono)}
  .tile .s{font-size:11px;color:var(--dim);margin-top:2px}
  .up{color:var(--up)} .dn{color:var(--dn)} .dim{color:var(--dim)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-bottom:14px}
  .pair{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .pair .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .pair .nm{font-weight:700;font-size:14px;letter-spacing:.05em}
  .pair .px{font-family:var(--mono);font-size:14px}
  .row{display:flex;justify-content:space-between;font-size:12px;padding:2.5px 0;border-bottom:1px dashed rgba(28,38,54,.6)}
  .row:last-child{border-bottom:none}
  .row .k{color:var(--dim)}
  .row .v{font-family:var(--mono)}
  .pos{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 9px;margin-top:7px;font-family:var(--mono);font-size:11.5px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
  .side-l{color:var(--up);font-weight:700}.side-s{color:var(--dn);font-weight:700}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th{font-size:10.5px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
  td{padding:8px 12px;border-bottom:1px solid rgba(28,38,54,.55);font-family:var(--mono);font-size:12.5px}
  tr:last-child td{border-bottom:none}
  .regime{display:inline-block;padding:1px 8px;border-radius:4px;font-size:10.5px;font-weight:600;letter-spacing:.06em}
  .rg-chop{background:rgba(107,122,144,.15);color:#9db0c7}
  .rg-runaway{background:rgba(22,199,132,.12);color:var(--up)}
  .rg-spike{background:rgba(234,57,67,.12);color:var(--dn)}
  .wait{color:var(--acc);font-size:11px;font-family:var(--mono);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
  footer{margin-top:12px;color:var(--dim);font-size:11px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
</style>
</head>
<body>
<header>
  <h1>COZANETHQ <span>· MULTI-PAIR SCALPER TERMINAL</span></h1>
  <div><span id="engine" class="pill wait">…</span>&nbsp;<span class="mono dim" id="age" style="font-size:11px"></span></div>
</header>

<div class="tiles">
  <div class="tile"><div class="k">Balance</div><div class="v" id="t-bal">—</div><div class="s" id="t-peak"></div></div>
  <div class="tile"><div class="k">Equity (incl. floating)</div><div class="v" id="t-eq">—</div><div class="s" id="t-fl"></div></div>
  <div class="tile"><div class="k">Open positions</div><div class="v" id="t-pos">—</div><div class="s" id="t-mgn"></div></div>
  <div class="tile"><div class="k">Closed trades (epoch)</div><div class="v" id="t-tr">—</div><div class="s" id="t-wr"></div></div>
</div>

<div class="grid" id="pairs">Loading pair lanes…</div>

<table id="ledger"><thead><tr><th>Pair</th><th>Side</th><th>Entry → Exit</th><th>Net PnL</th><th>Reason</th><th>Balance</th><th>Closed</th></tr></thead><tbody></tbody></table>

<footer>
  <div>Engine: multi-pair v5 — EV-after-costs gate · regime classifier · 8 global slots · shared $3 account</div>
  <div class="mono" id="tickinfo"></div>
</footer>

<script>
const RAW = "https://raw.githubusercontent.com/CozanetHQ/near-scalper-bot/main/state/state.json";
const fmt = (n, d=4) => (n===null||n===undefined||isNaN(n)) ? "—" : Number(n).toFixed(d);
const ago = iso => {
  if (!iso) return "never";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return Math.round(s) + "s ago";
  if (s < 3600) return Math.round(s/60) + "m ago";
  return (s/3600).toFixed(1) + "h ago";
};
const parsePositions = raw => {
  if (!raw || typeof raw !== "string" || !raw.startsWith("[")) return [];
  try { return JSON.parse(raw).slice(0, 8); } catch { return []; }
};
const snapshot = raw => {
  try { return JSON.parse(raw || "{}") || {}; } catch { return {}; }
};

let LATEST = null;

function render(m){
  LATEST = m;
  const acct = m.account || {};
  const pairs = m.pairs || {};
  const trades = (m.trades || []).filter(t => t.pair);
  const allPos = [];

  // account tiles
  const bal = Number(acct.balance) || 0;
  let floating = 0;
  Object.values(pairs).forEach(p => {
    const sn = snapshot(p.last_reversal_at);
    floating += Number(sn.u) || 0;
    parsePositions(p.last_error).forEach(x => allPos.push({pair: p.pair, ...x, s: x.s, e: x.e, t: x.t, m: x.m, pr: x.pr}));
  });
  const eq = bal + floating;
  const usedMargin = allPos.reduce((a, p) => a + (Number(p.m) || 0), 0);
  document.getElementById("t-bal").textContent = "$" + fmt(bal, 2);
  document.getElementById("t-peak").textContent = "peak $" + fmt(acct.peak_balance, 2);
  const eqEl = document.getElementById("t-eq");
  eqEl.textContent = "$" + fmt(eq, 2);
  eqEl.className = "v " + (eq >= bal ? "up" : "dn");
  document.getElementById("t-fl").textContent = "floating " + (floating >= 0 ? "+" : "") + "$" + fmt(floating, 4);
  const maxPos = Number(acct.max_positions) || 8;
  document.getElementById("t-pos").textContent = allPos.length + " / " + maxPos;
  document.getElementById("t-mgn").textContent = "margin locked $" + fmt(usedMargin, 2) + " (" + ((usedMargin/Math.max(bal,0.01))*100).toFixed(0) + "%)";

  // epoch trades: since last reset (approx: all in window)
  const wl = trades.reduce((a, t) => { const n = Number(t.net_pnl) || 0; if (n > 0) a.w++; else a.l++; return a; }, {w:0, l:0});
  document.getElementById("t-tr").textContent = trades.length;
  document.getElementById("t-wr").textContent = wl.w + "W / " + wl.l + "L" + (trades.length ? " · " + Math.round(wl.w/trades.length*100) + "%" : "");

  // engine status
  const age = acct.last_tick_at ? (Date.now() - new Date(acct.last_tick_at).getTime()) / 1000 : 1e9;
  const pill = document.getElementById("engine");
  if (age < 400) { pill.className = "pill live"; pill.textContent = "ENGINE LIVE"; }
  else { pill.className = "pill dead"; pill.textContent = "ENGINE STALLED"; }
  document.getElementById("age").textContent = "last tick " + ago(acct.last_tick_at);
  document.getElementById("tickinfo").textContent = "updated_at " + ago(m.updated_at) + " · state committed via git every tick";

  // pair lanes
  const box = document.getElementById("pairs");
  box.innerHTML = "";
  const names = Object.keys(pairs).sort();
  names.forEach(sym => {
    const p = pairs[sym];
    const sn = snapshot(p.last_reversal_at);
    const ps = parsePositions(p.last_error);
    const tag = sym.replace("USDT", "");
    const rg = (sn.rg || "chop");
    const el = document.createElement("div");
    el.className = "pair";
    let posHtml = ps.map(x =>
      `<div class="pos"><span class="${x.s === "long" ? "side-l" : "side-s"}">${(x.s||"?").toUpperCase()}</span>
       <span>$${fmt(x.e, 4)} → $${fmt(x.t, 4)}</span><span>m $${fmt(x.m, 2)}</span></div>`).join("");
    const w = Number(p.wins) || 0, l = Number(p.losses) || 0;
    el.innerHTML = `
      <div class="hd"><span class="nm">${tag}<span class="dim mono" style="font-weight:400;font-size:11px">/USDT</span></span><span class="px">$${fmt(p.last_price, 4)}</span></div>
      <div class="row"><span class="k">Regime</span><span><span class="regime rg-${rg}">${(rg||"—").toUpperCase()}</span></span></div>
      <div class="row"><span class="k">Pair W / L</span><span class="v">${w}W / ${l}L <span class="dim">(${Number(p.total_trades)||0} trades)</span></span></div>
      <div class="row"><span class="k">Open here</span><span class="v">${ps.length} <span class="dim">slot(s)</span></span></div>
      <div class="row"><span class="k">Equity</span><span class="v">$${fmt(sn.eq, 4)} <span class="dim">(fl ${Number(sn.u||0) >= 0 ? "+" : ""}${fmt(sn.u, 3)})</span></span></div>
      ${posHtml}
      ${sn.w && sn.w !== "" ? `<div class="wait">WAIT — ${sn.w}</div>` : ""}`;
    box.appendChild(el);
  });
}

async function refresh(){
  try {
    const res = await fetch(RAW + "?t=" + Math.floor(Date.now() / 60000), {cache: "no-store"});
    if (!res.ok) throw new Error(res.status);
    render(await res.json());
  } catch (e) {
    const pill = document.getElementById("engine");
    pill.className = "pill dead"; pill.textContent = "NO FEED";
  }
}
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
