<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>CozanetHQ — Execution Chart</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<style>
:root{
  --bg:#0b0e14; --panel:#12161f; --panel2:#171c27; --line:#232a38;
  --text:#e7ecf3; --dim:#8b95a7; --teal:#00ceca; --green:#22c55e;
  --red:#ef4444; --amber:#f59e0b; --mono:ui-monospace,'SF Mono','Cascadia Code',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,'Segoe UI',Roboto,Inter,sans-serif;
     display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);
       border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:14px;font-weight:600;letter-spacing:.4px;white-space:nowrap}
header h1 a{color:var(--teal);text-decoration:none}
header .sub{font-size:11px;color:var(--dim);white-space:nowrap}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;
       padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer;max-width:42vw}
.pill{font-size:11px;padding:5px 10px;border-radius:999px;background:var(--panel2);
      border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.pill b{color:var(--text)}
.pill.mode-live{color:var(--mint);border-color:rgba(45,212,167,.45);background:rgba(45,212,167,.10)}
.pill.mode-paper{color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;
     box-shadow:0 0 6px var(--green);margin-right:6px}
main{flex:1;display:flex;min-height:0}
#zoomin,#zoomout,#replaybtn,#fitbtn,#asidetoggle{background:#292a2d;color:#e8eaed;border:1px solid #3a3d42;border-radius:999px;
  padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;touch-action:manipulation}
#zoomin:hover,#zoomout:hover,#replaybtn:hover,#fitbtn:hover,#asidetoggle:hover{background:#35383d}
#chartwrap{flex:1;position:relative;min-width:0}
#chart{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#loadpill{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(18,21,26,.92);
  border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:11px;color:var(--teal);
  display:none;z-index:6;white-space:nowrap}
#statsbar{position:absolute;left:10px;bottom:36px;display:flex;align-items:center;gap:12px;
  background:rgba(18,21,26,.92);border:1px solid #2a2f38;border-radius:10px;padding:8px 12px;z-index:5;
  max-width:calc(100% - 20px);flex-wrap:wrap}
#statsbar[hidden]{display:none}
#statsbar .stat{display:flex;flex-direction:column;gap:2px}
#statsbar label{font-size:9px;letter-spacing:.12em;color:#9aa0a6;font-weight:600}
#statsbar b{font-size:13px;color:#e8eaed;font-variant-numeric:tabular-nums}
#statsbar .sep{width:1px;height:22px;background:#2a2f38}
#statsbar #sbClear{background:none;border:none;color:#9aa0a6;cursor:pointer;font-size:13px;margin-left:2px;padding:4px 8px}
#statsbar #sbClear:hover{color:#fff}
#legend{position:absolute;left:10px;top:10px;background:rgba(18,22,31,.82);border:1px solid var(--line);
        border-radius:8px;padding:8px 12px;font-size:11px;color:var(--dim);pointer-events:none;z-index:4}
#legend .lrow{display:flex;gap:8px;align-items:center;margin:2px 0}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
aside{width:380px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
aside .ahead{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--dim)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);
      background:transparent;color:var(--dim);cursor:pointer;font-weight:600;touch-action:manipulation}
.chip.on{background:var(--teal);border-color:var(--teal);color:#04252a}
#rows{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.day{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);
     text-align:center;padding:12px 0 6px;position:sticky;top:0;background:var(--panel);z-index:2}
.tgroup{padding:8px 14px 10px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.tgroup:hover{background:var(--panel2)}
.tgroup.sel{background:#182233;box-shadow:inset 3px 0 0 var(--teal)}
.bub{display:flex;gap:8px;margin:5px 0;align-items:flex-start}
.bub .av{width:22px;height:22px;border-radius:50%;background:var(--teal);color:#04252a;
         font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.bub .bd{background:var(--panel2);border:1px solid var(--line);border-radius:4px 12px 12px 12px;
         padding:7px 10px;font-size:12px;flex:1;min-width:0}
.bub .bd .tm{float:right;color:var(--dim);font-size:10px;font-family:var(--mono);margin-left:10px}
.bub.sys .av{background:var(--panel2);color:var(--teal);border:1px solid var(--teal)}
.bub.sys .bd{border-color:rgba(0,206,202,.35)}
.anal{color:var(--teal)}
.pairtag{display:inline-block;background:rgba(0,206,202,.13);border:1px solid rgba(0,206,202,.4);
         color:var(--teal);font-size:9px;font-weight:700;padding:0 5px;border-radius:3px;
         margin-right:6px;letter-spacing:.4px;text-transform:uppercase}
.expl{color:var(--dim);font-size:10px;margin-top:2px;font-family:var(--mono)}
.errbanner{background:var(--red);color:#fff;text-align:center;padding:6px;font-size:12px;display:none}
/* mobile-first: full-width chart, chat as drawer */
#asidetoggle{display:flex}
aside{position:fixed;right:0;top:0;bottom:0;width:min(94vw,380px);z-index:20;
      transform:translateX(100%);transition:transform .2s;box-shadow:-8px 0 30px rgba(0,0,0,.5)}
aside.open{transform:none}
#legend{display:none}
@media(min-width:921px){
  #asidetoggle{display:none}
  aside{position:static;transform:none;box-shadow:none;width:380px}
  #legend{display:block}
}
</style>
</head>
<body>
<header>
  <h1><a href="index.html">NEAR SCALPER</a> · EXECUTION</h1>
  <select id="symbol" aria-label="Trading pair"></select>
  <span class="pill" id="pnlpill">P&L <b>—</b></span>
  <span class="pill" id="modepill" title="Trading mode — flips via the Set Trading Mode workflow">MODE ···</span>
  <span class="sub" id="updated"><span class="dot"></span>loading…</span>
  <select id="tz" aria-label="Timezone">
    <option value="Africa/Lagos">WAT · Lagos</option>
    <option value="UTC">UTC</option>
    <option value="Europe/London">BST · London</option>
    <option value="America/New_York">ET · New York</option>
    <option value="Asia/Dubai">GST · Dubai</option>
    <option value="Asia/Singapore">SGT · Singapore</option>
  </select>
  <button id="zoomout" title="Zoom out (time axis)">⊖</button>
  <button id="zoomin" title="Zoom in (time axis)">⊕</button>
  <button id="fitbtn" title="Fit all loaded history">⤢ Fit</button>
  <button id="replaybtn" title="Replay the selected trade (or the latest one)">⟲ Replay</button>
  <button id="asidetoggle">☰ Chat</button>
</header>
<div class="errbanner" id="err">Data fetch failed — retrying…</div>
<main>
  <div id="chartwrap">
    <canvas id="chart"></canvas>
    <div id="loadpill">loading candles…</div>
    <div id="legend">
      <div class="lrow"><span class="sw" style="background:rgba(34,197,94,.25);border:1px solid var(--green)"></span>Take-profit zone</div>
      <div class="lrow"><span class="sw" style="background:rgba(239,68,68,.22);border:1px solid var(--red)"></span>Stop-loss zone</div>
      <div class="lrow"><span class="sw" style="background:rgba(0,206,202,.16);border:1px solid var(--teal)"></span>Fair Value Gap</div>
      <div class="lrow"><span style="border-top:2px dotted var(--amber);width:14px;display:inline-block"></span>Liquidity sweep</div>
    </div>
    <div id="statsbar" hidden>
      <span class="stat"><label>ENTRY</label><b id="sbEntry">—</b></span>
      <span class="sep"></span>
      <span class="stat"><label>R:R RATIO</label><b id="sbRR">—</b></span>
      <span class="sep"></span>
      <span class="stat"><label>SIDE</label><b id="sbSide">—</b></span>
      <button id="sbClear" title="Clear replay overlay">✕</button>
    </div>
  </div>
  <aside id="aside">
    <div class="ahead">
      <h2>Execution chat · <span id="chatpair">—</span></h2>
      <div class="chips">
        <button class="chip on" data-f="ALL">All</button>
        <button class="chip" data-f="OPEN">Open</button>
        <button class="chip" data-f="WIN_TP_HIT">Wins</button>
        <button class="chip" data-f="LOSS_SL_HIT">Losses</button>
      </div>
    </div>
    <div id="rows"></div>
  </aside>
</main>

<script>
"use strict";
/* ── CozanetHQ execution chart — CUSTOM canvas engine (owner 2026-09-16).
   No external chart library (Aegis-style: we own the render pipeline).
   Layer 1: 2m candles (Bitget 1m -> 2m, resampled client-side)
   Layer 2: TP/SL zone boxes for the selected trade (dashed, clipped)
   Layer 3: entry/exit markers
   Layer 4: FVG band + liquidity sweep line
   Pan: one-finger drag / mouse drag · Zoom: pinch / wheel · Fit: ⤢ ──────── */
window.addEventListener("error", e => {
  const b = document.getElementById("err");
  if (b) { b.textContent = "Error: " + (e.message || "script failed"); b.style.display = "block"; }
});
const RAW = new URLSearchParams(location.search).get("raw")
         || "https://raw.githubusercontent.com/CozanetHQ/near-scalper-bot/main/";
const BITGET = "https://api.bitget.com/api/v2/mix/market";
// Proxy through our own Vercel serverless functions when available — the
// owner's mobile IP got geo-blocked/throttled hitting Bitget directly.
const HAS_PROXY = location.hostname.endsWith("vercel.app");
// Owner 2026-09-16: GitHub Pages has no serverless functions, and the
// owner's ISP geo-blocks direct Bitget API calls — the GH-Pages chart died
// with "Data fetch failed" while the Vercel copy worked, which is why the
// two URLs seemed like two different apps. Fall back to the Vercel proxy
// (it serves Access-Control-Allow-Origin: *) so BOTH URLs behave the same
// on any network. Vercel origin: proxy first, direct as backup. GH Pages:
// direct first (fast where it works), proxy as backup.
const PROXY = "https://cozanet-scalper-chart.vercel.app";
async function bitgetFetch(kind, params) {
  const routes = HAS_PROXY
    ? [`/api/${kind}?${params}`, `${BITGET}/${kind}?${params}&productType=USDT-FUTURES`]
    : [`${BITGET}/${kind}?${params}&productType=USDT-FUTURES`, `${PROXY}/api/${kind}?${params}`];
  let err = null;
  for (const url of routes) {
    try {
      const r = await fetch(url);
      if (r.ok) return await r.json();
      err = "HTTP " + r.status;
    } catch (e) { err = e.message || e; }
  }
  throw new Error(`${kind} fetch failed (${err})`);
}
const $ = id => document.getElementById(id);
const pairToSymbol = p => p.replace("/", "");           // NEAR/USDT -> NEARUSDT

/* ── state ── */
let TRADES = {}, ZONEV = {}, symbols = [], curSym = null, filter = "ALL", selTrade = null, selZone = null;
let candles2m = new Map();              // bucketMs -> {open,high,low,close} (bound per pair)
const CANDLE_CACHE = {};               // pair -> Map (owner 2026-09-16: switching back to a
                                       //  pair reuses its candles — no refetch, instant chart)
function bindCandles(sym) {
  candles2m = CANDLE_CACHE[sym] || (CANDLE_CACHE[sym] = new Map());
  barsDirty = true;
}
let bars = [], barsDirty = true;      // sorted 2m bars cache
let TZ = localStorage.getItem("cozy.tz") || "Africa/Lagos";   // owner: NG (WAT) default
$("tz").value = [...$("tz").options].some(o=>o.value===TZ) ? TZ : "Africa/Lagos";
let livePrice = null, loadingBar = false;

/* ── data: trades JSON (REST contract, section 5) ── */
async function loadTrades() {
  const r = await fetch(RAW + "data/trades_ui.json?t=" + Date.now(), {cache:"no-store"});
  if (!r.ok) throw new Error("trades_ui.json " + r.status);
  const j = await r.json();
  TRADES = j.symbols || {};
  ZONEV = j.zones || {};
  // Owner 2026-09-17: the chart must declare WHICH mode produced the
  // records it's stroking in (live vs paper). trades_ui.json re-exports
  // every tick, so the badge follows a mode switch within one tick.
  const mode = String(j.mode || "PAPER").toUpperCase();
  const mp = $("modepill");
  mp.textContent = "MODE " + (mode === "LIVE" ? "LIVE · real" : "PAPER");
  mp.className = "pill " + (mode === "LIVE" ? "mode-live" : "mode-paper");
  const prev = curSym;
  symbols = Object.keys(TRADES).sort();
  const sel = $("symbol");
  sel.innerHTML = symbols.map(s => `<option>${s}</option>`).join("");
  if (prev && symbols.includes(prev)) { sel.value = prev; curSym = prev; }
  else {
    // Owner 2026-09-16: the chart used to open on the alphabetically-first
    // pair (BTC/USDT) — a sovereign pair that can stay silent for days, so
    // recent trades looked "not stroked in the chat and on the chart" even
    // though other pairs were trading live. Open on the pair with the
    // FRESHEST trade activity; honor the user's last manual pick only if
    // that pair actually traded within the last 24h.
    const fresh = s => (TRADES[s] || []).reduce(
      (m, t) => Math.max(m, t.exit_time || 0, t.entry_time || 0), 0);
    const best = symbols.reduce((a, s) => (!a || fresh(s) > fresh(a)) ? s : a, null);
    const last = localStorage.getItem("cozy.chartPair");
    const dayAgo = Date.now() / 1000 - 86400;
    curSym = (last && symbols.includes(last) && fresh(last) > dayAgo) ? last
           : (best || symbols[0]);
    sel.value = curSym;
  }
  $("updated").innerHTML = `<span class="dot"></span>updated ${new Intl.DateTimeFormat([], {timeZone:TZ, hour:"2-digit", minute:"2-digit", hour12:false}).format(new Date(j.updated))} ${TZ.split("/").pop().replace("_"," ")}`;
  renderRows(); draw();
}

/* ── candles: Bitget 1m -> 2m ── */
async function fetch1m(sym, startMs, endMs) {
  let params = `symbol=${sym}&limit=1000`;
  if (startMs && endMs) params += `&startTime=${startMs}&endTime=${endMs}`;
  const j = await bitgetFetch("candles", params);
  if (j.code !== "00000") throw new Error(j.msg);
  return j.data.map(d => ({ts:+d[0],open:+d[1],high:+d[2],low:+d[3],close:+d[4],vol:+d[5]}))
               .sort((a,b)=>a.ts-b.ts);
}
function absorb1m(rows) {
  for (const c of rows) {
    const b = Math.floor(c.ts/120000)*120000;
    let k = candles2m.get(b);
    if (!k) { candles2m.set(b,{open:c.open,high:c.high,low:c.low,close:c.close}); }
    else { k.high=Math.max(k.high,c.high); k.low=Math.min(k.low,c.low); k.close=c.close; }
  }
  barsDirty = true;
  if (loadingBar) fitAll();           // keep whole history in view while backfilling
}
function getBars() {
  if (barsDirty) {
    bars = [...candles2m.entries()].sort((a,b)=>a[0]-b[0])
      .map(([ms,v]) => ({ts:ms/1000, o:v.open, h:v.high, l:v.low, c:v.close}));
    barsDirty = false;
  }
  return bars;
}
async function ensureCandles(fromS, toS) {
  const sym = pairToSymbol(curSym);
  loadingBar = true; $("loadpill").style.display = "block";
  try {
    if (candles2m.size === 0) {
      // guarded fetch: a flaky mobile-network request must not kill the page
      for (let attempt = 0; attempt < 4; attempt++) {
        try { absorb1m(await fetch1m(sym)); break; }
        catch (e) {
          $("err").textContent = "Chart data fetch failed — retrying…";
          $("err").style.display = "block";
          await new Promise(r => setTimeout(r, 1500 * (attempt + 1)));
        }
      }
      if (!candles2m.size) { $("err").textContent = "Chart data unavailable — check connection and reload."; $("err").style.display = "block"; return; }
      $("err").style.display = "none";
    }
    // multi-hop backfill: one 1m fetch only covers ~16.7h (1000 candles),
    // so loop backward/forward until the range is covered or data runs out.
    const MAX_HOPS = 30;
    let hops = 0;
    while (hops < MAX_HOPS) {
      const first = Math.min(...candles2m.keys());
      if (fromS*1000 >= first - 120000) break;
      try {
        const rows = await fetch1m(sym, Math.max(0, fromS*1000 - 3600e3), first);
        if (!rows.length) break;
        absorb1m(rows);
        if (Math.min(...candles2m.keys()) >= first) break;  // retention floor
      } catch (e) { break; }
      hops++;
    }
    hops = 0;
    while (hops < MAX_HOPS) {
      const last = Math.max(...candles2m.keys());
      if (toS*1000 <= last + 120000) break;
      try {
        const rows = await fetch1m(sym, last, toS*1000 + 3600e3);
        if (!rows.length) break;
        absorb1m(rows);
        if (Math.max(...candles2m.keys()) <= last) break;  // no progress
      } catch (e) { break; }
      hops++;
    }
  } finally {
    loadingBar = false; $("loadpill").style.display = "none";
  }
}

/* ══ CUSTOM CHART ENGINE ══════════════════════════════════════════════════
   View model: VW = {t1, t2} seconds. Price scale auto-fits visible bars.
   Everything (candles, markers, zones, price lines, crosshair) draws on one
   canvas — we own the pipeline, anything can be added (Aegis-style).      */
const cv = $("chart"), ctx = cv.getContext("2d");
const AXR = 62, AXB = 22;              // right price axis / bottom time axis px
let VW = {t1: 0, t2: 0};              // visible window (sec)
let CW = 0, CH = 0;                   // canvas css px
let hover = null;                     // {x,y} crosshair

function resize() {
  const wrap = $("chartwrap"), dpr = window.devicePixelRatio || 1;
  CW = wrap.clientWidth; CH = wrap.clientHeight;
  cv.width = CW * dpr; cv.height = CH * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!VW.t2 && getBars().length) fitAll();
  draw();
}
const t2x = t => (t - VW.t1) / (VW.t2 - VW.t1) * (CW - AXR);
const x2t = x => VW.t1 + x / (CW - AXR) * (VW.t2 - VW.t1);

function fitAll() {
  const b = getBars();
  if (!b.length) return;
  const span = b[b.length-1].ts - b[0].ts + 120;
  VW.t1 = b[0].ts - span * 0.02;
  VW.t2 = b[b.length-1].ts + 120 + span * 0.02;
  draw();
}
function visBars() {
  const b = getBars();
  let lo = 0, hi = b.length;          // binary search visible slice
  while (lo < hi) { const m = (lo+hi)>>1; if (b[m].ts < VW.t1 - 120) lo = m+1; else hi = m; }
  const start = lo; hi = b.length;
  while (lo < hi) { const m = (lo+hi)>>1; if (b[m].ts <= VW.t2) lo = m+1; else hi = m; }
  return b.slice(start, lo);
}

function niceStep(range, targetLines) {
  const raw = range / targetLines;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1, 2, 2.5, 5, 10]) if (mag * m >= raw) return mag * m;
  return mag * 10;
}
function fmtP(p) { return p==null ? "—" : (p>=1000 ? p.toFixed(1) : p>=10 ? p.toFixed(2) : p.toFixed(4)); }
const hourFmt = () => new Intl.DateTimeFormat([], {timeZone:TZ, hour:"2-digit", minute:"2-digit", hour12:false});

function tzOffsetSec() {
  // offset of the selected tz right now, so axis ticks land on wall-clock :00
  const d = new Date();
  const loc = new Date(d.toLocaleString("en-US", {timeZone: TZ}));
  return Math.round((loc - d) / 1000);
}
function draw() {
  ctx.clearRect(0, 0, CW, CH);
  const plotW = CW - AXR, plotH = CH - AXB;
  if (plotW <= 10 || plotH <= 10) return;
  const vis = visBars();
  if (!vis.length) {  // nothing loaded for this window — offer a hint
    ctx.fillStyle = "#8b95a7"; ctx.font = "12px -apple-system,sans-serif"; ctx.textAlign = "center";
    ctx.fillText("no candles in this window — hit ⤢ Fit", plotW/2, plotH/2);
    ctx.textAlign = "left"; return;
  }
  let pMin = Infinity, pMax = -Infinity;
  for (const b of vis) { if (b.l < pMin) pMin = b.l; if (b.h > pMax) pMax = b.h; }
  const padP = (pMax - pMin) * 0.08 || pMax * 0.001;
  pMin -= padP; pMax += padP;
  const y = p => plotH - (p - pMin) / (pMax - pMin) * plotH;

  /* grid + price axis */
  const step = niceStep(pMax - pMin, Math.max(3, Math.floor(plotH / 46)));
  ctx.font = "11px -apple-system,sans-serif"; ctx.textBaseline = "middle";
  for (let p = Math.ceil(pMin/step)*step; p <= pMax; p += step) {
    const yy = y(p);
    ctx.strokeStyle = "#161c28"; ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(plotW, yy); ctx.stroke();
    ctx.fillStyle = "#8b95a7"; ctx.textAlign = "left";
    ctx.fillText(fmtP(p), plotW + 6, yy);
  }
  /* time axis: hour ticks (day boundary when span > 2 days) */
  const span = VW.t2 - VW.t1;
  const hf = hourFmt();
  const dayF = new Intl.DateTimeFormat([], {timeZone:TZ, weekday:"short", day:"2-digit", month:"short"});
  const tStep = span > 86400*2 ? 86400 : span > 14400 ? 3600 : span > 3600 ? 900 : 300;
  ctx.textAlign = "center";
  const off = tzOffsetSec();
  const startTick = Math.ceil((VW.t1 - off) / tStep) * tStep + off;
  for (let t = startTick; t <= VW.t2; t += tStep) {
    const xx = t2x(t);
    if (xx < 0 || xx > plotW) continue;
    ctx.strokeStyle = "#161c28"; ctx.beginPath(); ctx.moveTo(xx, 0); ctx.lineTo(xx, plotH); ctx.stroke();
    const d = new Date(t * 1000);
    ctx.fillStyle = "#8b95a7";
    ctx.fillText(tStep >= 86400 ? dayF.format(d) : hf.format(d), xx, plotH + 11);
  }
  /* axis borders */
  ctx.strokeStyle = "#232a38";
  ctx.beginPath(); ctx.moveTo(plotW + .5, 0); ctx.lineTo(plotW + .5, CH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, plotH + .5); ctx.lineTo(CW, plotH + .5); ctx.stroke();

  /* candles */
  const barW = plotW / vis.length;
  const bodyW = Math.max(1, Math.min(13, barW * 0.7));
  for (let i = 0; i < vis.length; i++) {
    const b = vis[i], cx = Math.floor(t2x(b.ts) + barW/2) + .5;
    const up = b.c >= b.o;
    ctx.strokeStyle = up ? "#22c55e" : "#ef4444";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, y(b.h)); ctx.lineTo(cx, y(b.l)); ctx.stroke();
    const yO = y(b.o), yC = y(b.c);
    const top = Math.min(yO, yC), hgt = Math.max(1, Math.abs(yC - yO));
    ctx.fillStyle = up ? "#22c55e" : "#ef4444";
    ctx.fillRect(cx - bodyW/2, top, bodyW, hgt);
  }

  /* trades (layer 3): right-angle entry→exit brackets at real prices */
  drawTradeConnectors(t2x, y, plotW, plotH);

  /* zones for selected trade / zone event (layers 2 & 4) */
  const selT = selTrade && (TRADES[curSym]||[]).find(x => x.trade_id === selTrade);
  if (selT) drawTradeZones(selT, t2x, y, plotW, plotH);
  const selZ = selZone && (ZONEV[curSym]||[]).find(x => x.id === selZone);
  if (selZ) drawZoneEvent(selZ, t2x, y, plotW, plotH);

  /* entry / SL / TP price lines with right-axis tags */
  if (selT) {
    const mk = (p, color, title) => {
      if (!p || p <= 0 || p < pMin || p > pMax) return;
      const yy = y(p);
      ctx.strokeStyle = color; ctx.setLineDash([6,4]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(plotW, yy); ctx.stroke(); ctx.setLineDash([]);
      const lbl = title + " " + fmtP(p);
      const w = ctx.measureText(lbl).width + 10;
      ctx.fillStyle = color;
      ctx.fillRect(plotW - w, yy - 8, w, 16);
      ctx.fillStyle = "#0b0e14"; ctx.textAlign = "left";
      ctx.fillText(lbl, plotW - w + 5, yy);
    };
    mk(selT.entry_price, "#2979ff", "Entry");
    mk(selT.tp_price, "#22c55e", "TP");
    mk(selT.sl_price, "#f4645f", "SL");
  }
  /* live price line */
  if (livePrice != null && livePrice >= pMin && livePrice <= pMax) {
    const yy = y(livePrice);
    ctx.strokeStyle = "#8b95a7"; ctx.setLineDash([2,3]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(plotW, yy); ctx.stroke(); ctx.setLineDash([]);
    const lbl = fmtP(livePrice);
    const w = ctx.measureText(lbl).width + 10;
    ctx.fillStyle = "#e7ecf3";
    ctx.fillRect(plotW - w, yy - 8, w, 16);
    ctx.fillStyle = "#0b0e14"; ctx.textAlign = "left"; ctx.fillText(lbl, plotW - w + 5, yy);
  }
  /* crosshair (desktop hover) */
  if (hover && hover.x < plotW && hover.y < plotH) {
    ctx.strokeStyle = "#3a4252"; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(hover.x, 0); ctx.lineTo(hover.x, plotH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, hover.y); ctx.lineTo(plotW, hover.y); ctx.stroke();
    ctx.setLineDash([]);
    const t = Math.round(x2t(hover.x));
    const p = pMax - (hover.y / plotH) * (pMax - pMin);
    ctx.fillStyle = "#232a38"; ctx.fillRect(hover.x - 40, plotH + 1, 80, AXB - 2);
    ctx.fillStyle = "#e7ecf3"; ctx.textAlign = "center";
    ctx.fillText(hf.format(new Date(t*1000)), hover.x, plotH + 11);
    ctx.fillStyle = "#232a38"; ctx.fillRect(plotW, hover.y - 8, AXR, 16);
    ctx.fillStyle = "#e7ecf3"; ctx.textAlign = "left";
    ctx.fillText(fmtP(p), plotW + 6, hover.y);
  }
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
}

/* dashed zone boxes for the selected trade — clipped to its time span */
function drawTradeZones(t, t2x, y, plotW, plotH) {

      ctx.strokeStyle = "rgba(34,197,94,.8)"; ctx.strokeRect(xa, loT, xb-xa, hiT-loT);
      ctx.fillStyle = "rgba(34,197,94,.95)"; ctx.font = "700 10px -apple-system,sans-serif";

      ctx.fillStyle = "rgba(244,100,95,.95)"; ctx.font = "700 10px -apple-system,sans-serif";

      ctx.strokeStyle = "rgba(0,206,202,.55)"; ctx.lineWidth = 1; ctx.strokeRect(fx1, lo, xa-fx1, hi-lo);
      ctx.fillStyle = "rgba(0,206,202,.9)"; ctx.font = "700 10px -apple-system,sans-serif";

function drawZoneEvent(z, t2x, y, plotW, plotH) {

      ctx.strokeStyle = "rgba(0,206,202,.55)"; ctx.lineWidth = 1; ctx.strokeRect(x0, lo, x1-x0, Math.abs(yT-yB));
      ctx.fillStyle = "rgba(0,206,202,.95)"; ctx.font = "700 10px -apple-system,sans-serif";

// first 2m candle whose high/low touched the level (star/x in the zone box)
function findTouch(t, level, isHigh) {
  if (!level || level <= 0) return null;
  const from = Math.floor(t.entry_time*1000/120000)*120000;
  const to = (t.exit_time || Math.floor(Date.now()/1000))*1000;
  for (const [bucket, c] of candles2m) {
    if (bucket < from || bucket > to) continue;
    if (isHigh ? c.high >= level : c.low <= level) return { ts: bucket/1000, price: level };
  }

/* ── pan / zoom / crosshair (touch + mouse, one code path via pointers) ── */
const pointers = new Map();
let pinch0 = null;   // {d, t1, t2, midT}
let lastTapT = 0;
cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (pointers.size === 2) {
    const r = cv.getBoundingClientRect();
    const [a, b] = [...pointers.values()];
    pinch0 = { d: Math.abs(a.x - b.x) || 1, t1: VW.t1, t2: VW.t2,
               midT: x2t((a.x + b.x)/2 - r.left) };
  }
});
cv.addEventListener("pointermove", e => {
  const r = cv.getBoundingClientRect();
  hover = {x: e.clientX - r.left, y: e.clientY - r.top};
  if (!pointers.has(e.pointerId)) { draw(); return; }
  const prev = pointers.get(e.pointerId);
  if (pointers.size === 1) {           // pan
    const dt = -((e.clientX - prev.x) / (CW - AXR)) * (VW.t2 - VW.t1);
    VW.t1 += dt; VW.t2 += dt;
  } else if (pointers.size === 2) {     // pinch zoom (time axis)
    pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
    const [a, b] = [...pointers.values()];
    const d = Math.abs(a.x - b.x) || 1;
    const scale = pinch0.d / d;
    const span = (pinch0.t2 - pinch0.t1) * scale;
    VW.t1 = pinch0.midT - (pinch0.midT - pinch0.t1) / (pinch0.t2 - pinch0.t1) * span;
    VW.t2 = VW.t1 + span;
    clampVW();
  }
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  draw();
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch0 = null;
  // double-tap / double-click = fit (mobile-friendly)
  const now = Date.now();
  if (now - lastTapT < 350 && pointers.size === 0) fitAll();
  lastTapT = now;
  if (!pointers.size) { clampVW(); draw(); backfillIfEmpty(); }
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);
cv.addEventListener("pointerleave", () => { hover = null; draw(); });
/* ── zoom plumbing (owner 2026-09-16: "can't zoom in the chart") ─────────
   Span is clamped 10 min .. 45 days so a fast pinch-out or scroll can never
   collapse/overshoot the view into the dead "no candles" state, and if the
   view lands OUTSIDE loaded candles the engine now backfills automatically
   instead of sitting on a dead window. ⊕/⊖ header buttons give a guaranteed
   zoom path on any device (no gesture required). */
const MIN_SPAN = 600, MAX_SPAN = 45 * 86400;
function clampVW() {
  const span = VW.t2 - VW.t1, mid = (VW.t1 + VW.t2) / 2;
  if (span < MIN_SPAN) { VW.t1 = mid - MIN_SPAN/2; VW.t2 = mid + MIN_SPAN/2; }
  if (span > MAX_SPAN) { VW.t1 = mid - MAX_SPAN/2; VW.t2 = mid + MAX_SPAN/2; }
}
let _bfTimer = null;
function backfillIfEmpty() {
  if (visBars().length || !curSym) { return; }
  clearTimeout(_bfTimer);
  _bfTimer = setTimeout(() => {
    if (!visBars().length) ensureCandles(VW.t1, VW.t2).then(() => draw()).catch(() => {});
  }, 400);
}
function zoomBy(scale, anchorT) {
  const t = anchorT != null ? anchorT : (VW.t1 + VW.t2) / 2;
  const span = (VW.t2 - VW.t1) * scale;
  VW.t1 = t - (t - VW.t1) * scale;
  VW.t2 = t + (VW.t2 - t) * scale;

cv.addEventListener("wheel", e => {

/* ── trades (layer 3, drawn inside draw() by drawTradeConnectors) ── */
const EXIT_TAGS = { MAKER_TP_FILLED:"TP", SL_TAKER_STOP:"SL", BE_STOP:"BE",
  PROTECTED:"PROT", MAE_KILL:"KILL", HARD_SL:"HARD", MAX_AGE:"AGE",
  EOD:"EOD", LIQ:"LIQ", TIME_STOP:"TIME" };
function exitTag(r) { return EXIT_TAGS[r] || (r || "EXIT").slice(0, 4); }

/* TradingView-style brackets: a horizontal line AT the entry price from the
   entry bar to the exit bar, a vertical leg to the exit price (the right
   angle), and a tag saying WHY it closed. green = profit, red = loss;
   the arrow shape gives direction (▲ up = LONG, ▼ down = SHORT). */
function drawTradeConnectors(t2x, y, plotW, plotH) {
  const nowS = Math.floor(Date.now() / 1000);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, plotW, plotH); ctx.clip();
  ctx.font = "700 9px -apple-system,sans-serif";
  for (const t of filtered()) {
    const xa = t2x(t.entry_time);
    const endT = t.exit_time || nowS;
    const xb = t2x(endT);
    if (xb < -40 || xa > plotW + 40) continue;
    const eY = y(t.entry_price);
    const xY = t.exit_price != null ? y(t.exit_price) : null;
    const win = (t.net_pnl || 0) >= 0;
    const col = win ? "#22c55e" : "#f4645f";
    const long = t.direction === "LONG";

    /* entry price level, entry bar → exit bar */
    ctx.strokeStyle = col; ctx.lineWidth = 1.25;
    ctx.globalAlpha = .9; ctx.setLineDash([]);
    const x0 = Math.max(-40, xa), x1 = Math.min(plotW + 40, xb);
    if (x1 > x0 && eY > -plotH && eY < plotH * 2) {
      ctx.beginPath(); ctx.moveTo(x0, eY); ctx.lineTo(x1, eY); ctx.stroke();
    }

    /* entry arrow — points AT the entry price; shape = direction */
    if (xa >= -8 && xa <= plotW + 8 && eY > -20 && eY < plotH + 20) {
      ctx.fillStyle = col;
      const dir = long ? 1 : -1;                 /* ▲ below for LONG, ▼ above for SHORT */
      ctx.beginPath();
      ctx.moveTo(xa, eY);
      ctx.lineTo(xa - 4, eY + dir * 8);
      ctx.lineTo(xa + 4, eY + dir * 8);
      ctx.closePath(); ctx.fill();
    }

    if (!t.exit_time) continue;                  /* still open: level line is enough */

    /* exit right angle: vertical entry→exit price + horizontal tick */
    if (xY != null && xb >= -8 && xb <= plotW + 8) {
      ctx.globalAlpha = .95;
      ctx.beginPath(); ctx.moveTo(xb, eY); ctx.lineTo(xb, xY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(xb - 5, xY); ctx.lineTo(xb + 5, xY); ctx.stroke();

      /* WHY it closed — tag parked clear of the bracket leg */
      const tag = exitTag(t.reason_exit);
      const below = xY >= eY;                    /* exited below entry (SHORT win / LONG loss) */
      const ty = below ? Math.min(xY + 15, plotH - 2) : Math.max(xY - 13, 11);
      const tw = ctx.measureText(tag).width + 8;
      ctx.globalAlpha = 1;
      ctx.fillStyle = win ? "rgba(34,197,94,.18)" : "rgba(244,100,95,.18)";
      ctx.fillRect(xb - tw / 2, ty - 9, tw, 12);
      ctx.fillStyle = col; ctx.textAlign = "center";
      ctx.fillText(tag, xb, ty);
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

    if (z.fvg_bottom && z.fvg_top) bits.push(`FVG ${fmtP(z.fvg_bottom)}–${fmtP(z.fvg_top)}`);
    if (z.sweep_price) bits.push(`sweep ${fmtP(z.sweep_price)}`);
    expl = `${bits.join(" · ")} · ${z.note || "POST_ONLY"} · waiting for retest fill`;
  } else if (z.kind === "expired") {
    title = `◇ zone expired`;
  } else if (z.kind === "veto") {
    title = `◇ trigger vetoed`;
  } else { title = z.kind; }
  return `<div class="bub sys"><div class="av" style="background:#0d2b3f">${bull ? "▲" : "▼"}</div><div class="bd">` +
    `<span class="tm">${fmtT(z.ts)}</span><span class="pairtag">${z.pair || curSym}</span><span class="anal">${title}</span>` +
    `<div class="expl">${expl} · sovereign-v6</div></div></div>`;
}
function renderRows() {
  const trades = filtered().map(t => ({ kind: "t", ts: t.entry_time, t }));
  const zones = (filter === "ALL" ? (ZONEV[curSym]||[]) : []).map(z => ({ kind: "z", ts: z.ts, z }));
  const list = trades.concat(zones).sort((a, b) => b.ts - a.ts);
  $("chatpair").textContent = curSym;
  const pnl = (TRADES[curSym]||[]).reduce((a,t)=>a+(t.net_pnl||0),0);
  $("pnlpill").innerHTML = `P&L <b style="color:${pnl>=0?"var(--green)":"var(--red)"}">${pnl>=0?"+":""}${pnl.toFixed(3)} USDT</b>`;
  if (!list.length) {
    $("rows").innerHTML = `<div style="padding:20px;color:var(--dim)">No trades for this filter.</div>`;
    renderMarkers(); return;
  }
  let html = "", lastDay = "";
  for (const it of list) {
    const d = dayFmt.format(new Date(it.ts * 1000));
    if (d !== lastDay) { html += `<div class="day">${d}</div>`; lastDay = d; }
    if (it.kind === "t") {
      const t = it.t;
      html += `<div class="tgroup${t.trade_id === selTrade ? " sel" : ""}" data-tid="${t.trade_id}">` +
              tradeBubbles(t) + `</div>`;
    } else {
      const z = it.z;
      html += `<div class="tgroup${z.id === selZone ? " sel" : ""}" data-zid="${z.id}">` +
              zoneBubbles(z) + `</div>`;
    }
  }
  $("rows").innerHTML = html;
  document.querySelectorAll(".tgroup[data-tid]").forEach(el => el.onclick = () => selectTrade(el.dataset.tid));
  document.querySelectorAll(".tgroup[data-zid]").forEach(el => el.onclick = () => selectZone(el.dataset.zid));
  renderMarkers();
}

async function selectZone(zid) {
  try {
  const z = (ZONEV[curSym]||[]).find(x => x.id === zid);
  if (!z) return;
  selZone = zid; selTrade = null;
  clearReplay();
  await ensureCandles(z.ts - 7200, z.ts + 7200);
  VW = {t1: Math.max(0, z.ts - 5400), t2: z.ts + 2700};
  renderRows(); draw();
  if (window.innerWidth<=920) $("aside").classList.remove("open");
  } catch (e) {
    const b = document.getElementById("err");
    if (b) { b.textContent = "Zone replay error: " + (e.message || e); b.style.display = "block"; }
  }
}

async function selectTrade(tid) {
  try {
  selTrade = tid; selZone = null;
  const t = (TRADES[curSym]||[]).find(x=>x.trade_id===tid);
  if (!t) return;
  await ensureCandles(t.entry_time, t.exit_time||Math.floor(Date.now()/1000));
  const span = Math.max(1800, (t.exit_time||Math.floor(Date.now()/1000)) - t.entry_time);
  VW = {t1: Math.max(0, t.entry_time - span*0.5), t2: (t.exit_time||Math.floor(Date.now()/1000)) + span*0.5};
  applyReplay(t);
  renderRows(); draw();
  if (window.innerWidth<=920) $("aside").classList.remove("open");
  } catch (e) {
    const b = document.getElementById("err");
    if (b) { b.textContent = "Replay error: " + (e.message || e); b.style.display = "block"; }
  }
}

/* ── wiring ── */
$("symbol").onchange = async () => {
  curSym = $("symbol").value; selTrade = null; selZone = null;
  localStorage.setItem("cozy.chartPair", curSym);   // owner pick sticks
  clearReplay();
  bindCandles(curSym); VW = {t1:0, t2:0};
  /* INSTANT (owner 2026-09-16: "if I select eth it should show only its
     trades") — the chat used to sit on the PREVIOUS pair's trades for the
     whole candle backfill (10-60s on mobile). Render the new pair NOW;
     candles backfill behind the render. Old pair's candles stay cached. */
  renderRows(); draw();
  await bootCandles();
  renderRows(); draw();
};
document.querySelectorAll(".chip").forEach(c => c.onclick = () => {
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
  c.classList.add("on"); filter = c.dataset.f; renderRows(); draw();
});
$("asidetoggle").onclick = () => $("aside").classList.toggle("open");
$("tz").onchange = () => {
  TZ = $("tz").value; localStorage.setItem("cozy.tz", TZ);
  dayFmt = new Intl.DateTimeFormat([], {timeZone:TZ, weekday:"short", month:"short", day:"2-digit"});
  renderRows(); draw();
  loadTrades().catch(()=>{});   // refresh "updated" pill in the new tz
};
$("replaybtn").addEventListener("click", () => {
  const list = TRADES[curSym] || [];
  const latest = list[list.length - 1];   // arrays are oldest-first
  const tid = selTrade || (latest ? latest.trade_id : null);
  if (tid) selectTrade(tid);
});
$("fitbtn").addEventListener("click", fitAll);
$("zoomin").addEventListener("click", () => zoomBy(1/1.35));
$("zoomout").addEventListener("click", () => zoomBy(1.35));
$("sbClear").addEventListener("click", () => {
  selTrade = null; selZone = null; clearReplay(); renderRows(); fitAll();
});
new ResizeObserver(() => requestAnimationFrame(resize)).observe($("chartwrap"));

async function tickLoop() {
  for(;;) {
    try {
      const j = await bitgetFetch("ticker", `symbol=${pairToSymbol(curSym)}`);
      if (j.code==="00000" && j.data[0]) {
        livePrice = +j.data[0].lastPr;
        $("updated").innerHTML = `<span class="dot"></span>${curSym} ${fmtP(livePrice)}`;
        draw();
      }
    } catch(e){}
    await new Promise(r=>setTimeout(r, 30000));
  }
}

/* boot: load the FULL trade history for the current pair — the whole point
   of the custom engine is seeing the entire run, not just the last 24h. */
async function bootCandles() {
  const list = TRADES[curSym] || [];
  const zones = ZONEV[curSym] || [];
  let fromS = Math.floor(Date.now()/1000) - 86400;
  const stamps = list.map(t => t.entry_time).concat(zones.map(z => z.ts)).filter(Boolean);
  if (stamps.length) fromS = Math.min(...stamps) - 3600;
  await ensureCandles(fromS, Math.floor(Date.now()/1000));
  fitAll();
}

(async function boot(){
  for(;;) {
    try { await loadTrades(); $("err").style.display="none"; break; }
    catch(e) { $("err").style.display="block"; await new Promise(r=>setTimeout(r,5000)); }
  }
  resize();
  bindCandles(curSym);
  await bootCandles();
  renderRows(); draw();
  tickLoop();
  setInterval(loadTrades, 60000);
})();
</script>
</body>
