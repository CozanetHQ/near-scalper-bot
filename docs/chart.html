<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CozanetHQ — Execution Chart</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<style>
:root{
  --bg:#0b0e14; --panel:#12161f; --panel2:#171c27; --line:#232a38;
  --text:#e7ecf3; --dim:#8b95a7; --teal:#00ceca; --green:#22c55e;
  --red:#ef4444; --amber:#f59e0b; --mono:ui-monospace,'SF Mono','Cascadia Code',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,'Segoe UI',Roboto,Inter,sans-serif;
     display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);
       border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;font-weight:600;letter-spacing:.4px;white-space:nowrap}
header h1 a{color:var(--teal);text-decoration:none}
header .sub{font-size:11px;color:var(--dim);white-space:nowrap}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;
       padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer}
.pill{font-size:11px;padding:4px 10px;border-radius:999px;background:var(--panel2);
      border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.pill b{color:var(--text)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;
     box-shadow:0 0 6px var(--green);margin-right:6px}
main{flex:1;display:flex;min-height:0}
#replaybtn{background:#292a2d;color:#e8eaed;border:1px solid #3a3d42;border-radius:999px;
  padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
#replaybtn:hover{background:#35383d}
#statsbar{position:absolute;left:12px;bottom:44px;display:flex;align-items:center;gap:14px;
  background:rgba(18,21,26,.92);border:1px solid #2a2f38;border-radius:10px;padding:8px 14px;z-index:5}
#statsbar .stat{display:flex;flex-direction:column;gap:2px}
#statsbar label{font-size:9px;letter-spacing:.12em;color:#9aa0a6;font-weight:600}
#statsbar b{font-size:13px;color:#e8eaed;font-variant-numeric:tabular-nums}
#statsbar .sep{width:1px;height:22px;background:#2a2f38}
#statsbar #sbClear{background:none;border:none;color:#9aa0a6;cursor:pointer;font-size:11px;margin-left:2px}
#statsbar #sbClear:hover{color:#fff}
#chartwrap{flex:1;position:relative;min-width:0}
#chart{position:absolute;inset:0}
#overlay{position:absolute;inset:0;pointer-events:none}
#legend{position:absolute;left:12px;top:10px;background:rgba(18,22,31,.82);border:1px solid var(--line);
        border-radius:8px;padding:8px 12px;font-size:12px;color:var(--dim);pointer-events:none}
#legend .lrow{display:flex;gap:8px;align-items:center;margin:2px 0}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
aside{width:380px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
aside .ahead{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--dim)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);
      background:transparent;color:var(--dim);cursor:pointer;font-weight:600}
.chip.on{background:var(--teal);border-color:var(--teal);color:#04252a}
#rows{flex:1;overflow-y:auto}
.trow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 14px;
      border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.trow:hover{background:var(--panel2)}
.trow.sel{background:#182233;box-shadow:inset 3px 0 0 var(--teal)}
.trow .id{font-family:var(--mono);font-size:11px;color:var(--dim);grid-column:1/-1}
.trow .dir{font-weight:700;font-size:12px;letter-spacing:.4px}
.dir.long{color:var(--green)} .dir.short{color:var(--red)}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;justify-self:end}
.st-WIN_TP_HIT{background:rgba(34,197,94,.15);color:var(--green)}
.st-LOSS_SL_HIT{background:rgba(239,68,68,.15);color:var(--red)}
.st-OPEN{background:rgba(245,158,11,.15);color:var(--amber)}
.st-CANCELLED{background:rgba(139,149,167,.15);color:var(--dim)}
.trow .meta{font-size:11px;color:var(--dim);grid-column:1/-1;font-family:var(--mono)}
.pnl{font-family:var(--mono);font-weight:700;font-size:12px}
.pnl.pos{color:var(--green)} .pnl.neg{color:var(--red)}
/* chat feed (owner spec 2026-09-15: trades as a chat log, tz-aware) */
.day{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);
     text-align:center;padding:12px 0 6px;position:sticky;top:0;background:var(--panel);z-index:2}
.tgroup{padding:8px 14px 10px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.tgroup:hover{background:var(--panel2)}
.tgroup.sel{background:#182233;box-shadow:inset 3px 0 0 var(--teal)}
.bub{display:flex;gap:8px;margin:5px 0;align-items:flex-start}
.bub .av{width:22px;height:22px;border-radius:50%;background:var(--teal);color:#04252a;
         font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.bub .bd{background:var(--panel2);border:1px solid var(--line);border-radius:4px 12px 12px 12px;
         padding:7px 10px;font-size:12px;flex:1;min-width:0}
.bub .bd .tm{float:right;color:var(--dim);font-size:10px;font-family:var(--mono);margin-left:10px}
.bub.sys .av{background:var(--panel2);color:var(--teal);border:1px solid var(--teal)}
.bub.sys .bd{border-color:rgba(0,206,202,.35)}
.anal{color:var(--teal)}
.expl{color:var(--dim);font-size:10px;margin-top:2px;font-family:var(--mono)}
.errbanner{background:var(--red);color:#fff;text-align:center;padding:6px;font-size:12px;display:none}
@media(max-width:920px){
  aside{position:fixed;right:0;top:0;bottom:0;width:min(92vw,360px);z-index:20;
        transform:translateX(100%);transition:transform .2s;box-shadow:-8px 0 30px rgba(0,0,0,.5)}
  aside.open{transform:none}
  #asidetoggle{display:flex}
  #legend{display:none}
}
#asidetoggle{display:none;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);
             color:var(--text);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<header>
  <h1><a href="index.html">NEAR SCALPER</a> · EXECUTION CHART</h1>
  <select id="symbol" aria-label="Trading pair"></select>
  <span class="pill">2m candles · Bitget</span>
  <span class="pill" id="pnlpill">P&L <b>—</b></span>
  <span class="sub" id="updated"><span class="dot"></span>loading…</span>
  <select id="tz" aria-label="Timezone">
    <option value="Africa/Lagos">WAT · Lagos</option>
    <option value="UTC">UTC</option>
    <option value="Europe/London">BST · London</option>
    <option value="America/New_York">ET · New York</option>
    <option value="Asia/Dubai">GST · Dubai</option>
    <option value="Asia/Singapore">SGT · Singapore</option>
  </select>
  <button id="replaybtn" title="Replay the selected trade (or the latest one)">⟲ Replay</button>
  <button id="asidetoggle">☰ Chat</button>
</header>
<div class="errbanner" id="err">Data fetch failed — retrying…</div>
<main>
  <div id="chartwrap">
    <div id="chart"></div>
    <canvas id="overlay"></canvas>
    <div id="legend">
      <div class="lrow"><span class="sw" style="background:rgba(34,197,94,.25);border:1px solid var(--green)"></span>Take-profit zone</div>
      <div class="lrow"><span class="sw" style="background:rgba(239,68,68,.22);border:1px solid var(--red)"></span>Stop-loss zone</div>
      <div class="lrow"><span class="sw" style="background:rgba(0,206,202,.16);border:1px solid var(--teal)"></span>Fair Value Gap</div>
      <div class="lrow"><span style="border-top:2px dotted var(--amber);width:14px;display:inline-block"></span>Liquidity sweep</div>
    </div>
    <div id="statsbar" hidden>
      <span class="stat"><label>ENTRY</label><b id="sbEntry">—</b></span>
      <span class="sep"></span>
      <span class="stat"><label>R:R RATIO</label><b id="sbRR">—</b></span>
      <span class="sep"></span>
      <span class="stat"><label>SIDE</label><b id="sbSide">—</b></span>
      <button id="sbClear" title="Clear replay overlay">✕</button>
    </div>
  </div>
  <aside id="aside">
    <div class="ahead">
      <h2>Execution chat · bot log</h2>
      <div class="chips">
        <button class="chip on" data-f="ALL">All</button>
        <button class="chip" data-f="OPEN">Open</button>
        <button class="chip" data-f="WIN_TP_HIT">Wins</button>
        <button class="chip" data-f="LOSS_SL_HIT">Losses</button>
      </div>
    </div>
    <div id="rows"></div>
  </aside>
</main>

<!-- vendored same-origin (Aegis-style: ship the chart lib with the app).
     jsdelivr/unpkg CDNs are blocked on some mobile networks (owner's case)
     and a missing lib killed the entire page silently. -->
<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script>
  if (typeof LightweightCharts === "undefined")
    document.write('<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"><\/script>');
</script>
<script>
"use strict";
if (typeof LightweightCharts === "undefined") {
  document.body.insertAdjacentHTML("beforeend",
    '<div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);'
    + 'background:#12161f;border:1px solid #ef4444;border-radius:12px;padding:24px;'
    + 'color:#e7ecf3;font:14px -apple-system,sans-serif;z-index:99;max-width:80vw">'
    + '⚠ Chart library failed to load — check your connection and reload.</div>');
  throw new Error("lightweight-charts unavailable");
}
/* ── CozanetHQ execution chart (owner spec 2026-09-15) ───────────────────
   Layer 1: 2m candles (Bitget 1m -> resampled client-side)
   Layer 2: TP/SL risk bands (canvas overlay)
   Layer 3: entry/exit markers
   Layer 4: FVG band + liquidity sweep line                                   */
window.addEventListener("error", e => {
  const b = document.getElementById("err");
  if (b) { b.textContent = "Error: " + (e.message || "script failed"); b.style.display = "block"; }
});
const RAW = new URLSearchParams(location.search).get("raw")
         || "https://raw.githubusercontent.com/CozanetHQ/near-scalper-bot/main/";
const BITGET = "https://api.bitget.com/api/v2/mix/market";
// Proxy through our own Vercel serverless functions when available — the
// owner's mobile IP got geo-blocked/throttled hitting Bitget directly
// (works fine calling from Vercel's own servers). Falls back to direct
// Bitget calls on hosts without the proxy (e.g. GitHub Pages).
const HAS_PROXY = location.hostname.endsWith("vercel.app");
async function bitgetFetch(kind, params) {
  if (HAS_PROXY) {
    try {
      const r = await fetch(`/api/${kind}?${params}`);
      if (r.ok) return await r.json();
    } catch (e) { /* fall through to direct */ }
  }
  const r = await fetch(`${BITGET}/${kind}?${params}&productType=USDT-FUTURES`);
  return await r.json();
}
const $ = id => document.getElementById(id);
const pairToSymbol = p => p.replace("/", "");           // NEAR/USDT -> NEARUSDT

/* chart */
const chart = LightweightCharts.createChart($("chart"), {
  layout: {background:{type:"solid",color:"#0b0e14"},textColor:"#8b95a7"},
  grid: {vertLines:{color:"#161c28"},horzLines:{color:"#161c28"}},
  timeScale:{timeVisible:true,secondsVisible:false,borderColor:"#232a38",rightOffset:12},
  rightPriceScale:{borderColor:"#232a38"},
  crosshair:{mode:0},
  autoSize:true,
});
const candles = chart.addCandlestickSeries({
  upColor:"#22c55e",downColor:"#ef4444",borderVisible:false,wickUpColor:"#22c55e",wickDownColor:"#ef4444",
});
const overlay = $("overlay"), octx = overlay.getContext("2d");

/* state */
let TRADES = {}, symbols = [], curSym = null, filter = "ALL", selTrade = null;
const candles2m = new Map();          // ts -> {open,high,low,close}
let TZ = localStorage.getItem("cozy.tz") || "Africa/Lagos";   // owner: NG (WAT) default
$("tz").value = [...$("tz").options].some(o=>o.value===TZ) ? TZ : "Africa/Lagos";
let markers = [];

/* ── data: trades JSON (REST contract, section 5) ── */
async function loadTrades() {
  const r = await fetch(RAW + "data/trades_ui.json?t=" + Date.now(), {cache:"no-store"});
  if (!r.ok) throw new Error("trades_ui.json " + r.status);
  const j = await r.json();
  TRADES = j.symbols || {};
  const prev = curSym;
  symbols = Object.keys(TRADES).sort();
  const sel = $("symbol");
  sel.innerHTML = symbols.map(s => `<option>${s}</option>`).join("");
  if (prev && symbols.includes(prev)) { sel.value = prev; curSym = prev; }
  else { curSym = symbols[0]; sel.value = curSym; }
  $("updated").innerHTML = `<span class="dot"></span>updated ${new Intl.DateTimeFormat([], {timeZone:TZ, hour:"2-digit", minute:"2-digit", hour12:false}).format(new Date(j.updated))} ${TZ.split("/").pop().replace("_"," ")}`;
  renderRows(); drawOverlay();
}

/* ── candles: Bitget 1m -> 2m ── */
async function fetch1m(sym, startMs, endMs) {
  let params = `symbol=${sym}&limit=1000`;
  if (startMs && endMs) params += `&startTime=${startMs}&endTime=${endMs}`;
  const j = await bitgetFetch("candles", params);
  if (j.code !== "00000") throw new Error(j.msg);
  return j.data.map(d => ({ts:+d[0],open:+d[1],high:+d[2],low:+d[3],close:+d[4],vol:+d[5]}))
               .sort((a,b)=>a.ts-b.ts);
}
function absorb1m(rows) {
  for (const c of rows) {
    const b = Math.floor(c.ts/120000)*120000;
    let k = candles2m.get(b);
    if (!k) { candles2m.set(b,{open:c.open,high:c.high,low:c.low,close:c.close}); }
    else { k.high=Math.max(k.high,c.high); k.low=Math.min(k.low,c.low); k.close=c.close; }
  }
  chart.applyOptions({}); // no-op keeps chart responsive
  candles.setData([...candles2m.entries()].sort((a,b)=>a[0]-b[0])
    .map(([time,v])=>({time:time/1000,open:v.open,high:v.high,low:v.low,close:v.close})));
}
async function ensureCandles(fromS, toS) {
  const sym = pairToSymbol(curSym);
  if (candles2m.size === 0) {
    // BUGFIX 09-15: this fetch was unguarded — a single flaky mobile-network
    // request threw here, which killed renderRows()/drawOverlay()/tickLoop()
    // for the ENTIRE page (chart + sidebar both went blank, header still
    // showed because loadTrades() already ran). Now retries with backoff
    // and never throws past this point.
    for (let attempt = 0; attempt < 4; attempt++) {
      try { absorb1m(await fetch1m(sym)); return; }
      catch (e) {
        $("err").textContent = "Chart data fetch failed — retrying…";
        $("err").style.display = "block";
        await new Promise(r => setTimeout(r, 1500 * (attempt + 1)));
      }
    }
    $("err").textContent = "Chart data unavailable — check connection and reload.";
    $("err").style.display = "block";
    return; // give up gracefully; header/sidebar still render
  }
  $("err").style.display = "none";
  const first = Math.min(...candles2m.keys()), last = Math.max(...candles2m.keys());
  const needBefore = fromS*1000 < first - 120000, needAfter = toS*1000 > last + 120000;
  if (!needBefore && !needAfter) return;
  try {
    const tasks = [];
    if (needBefore) tasks.push(fetch1m(sym, Math.max(0, fromS*1000 - 3600e3), first));
    if (needAfter)  tasks.push(fetch1m(sym, last, toS*1000 + 3600e3));
    (await Promise.all(tasks)).forEach(absorb1m);
  } catch(e) { /* window fetch optional — candles may be out of Bitget retention */ }
}

/* ── markers (layer 3) ── */
function renderMarkers() {
  const list = filtered().map(t => {
    const m = [{time:t.entry_time, position:t.direction==="LONG"?"belowBar":"aboveBar",
      color:t.direction==="LONG"?"#22c55e":"#ef4444",
      shape:t.direction==="LONG"?"arrowUp":"arrowDown",
      text:(t.direction==="LONG"?"BUY":"SELL")+(t.engine==="sovereign-v6"?" ★":"")}];
    if (t.exit_time) {
      const win = t.status==="WIN_TP_HIT";
      m.push({time:t.exit_time, position:t.direction==="LONG"?"aboveBar":"belowBar",
        color:win?"#22c55e":"#ef4444", shape:win?"arrowUp":"arrowDown",
        text:win?"TP ✓":"SL ✗"});
    }
    return m;
  }).flat().sort((a,b)=>a.time-b.time);
  markers = list;
  candles.setMarkers(list);
}

/* ── risk bands + FVG + sweep (layers 2 & 4, canvas overlay) ── */
function filtered() { return (TRADES[curSym]||[]).filter(t=>filter==="ALL"||t.status===filter); }

/* ── replay overlay (owner 2026-09-16, Gemini-mockup style): dotted
   Entry/SL/TP price lines with axis labels + shaded trade-span rectangle ── */
let activePriceLines = [];
function clearReplay() {
  for (const l of activePriceLines) { try { candles.removePriceLine(l); } catch(e){} }
  activePriceLines = [];
  $("statsbar").hidden = true;
}
const LS = (window.LightweightCharts && LightweightCharts.LineStyle) || {Dashed:1, Dotted:2};
function applyReplay(t) {
  clearReplay();
  if (!t) return;
  const mk = (p, color, title, style) => {
    if (!p || p <= 0) return;
    activePriceLines.push(candles.createPriceLine({
      price: p, color, lineWidth: 1, lineStyle: style,
      axisLabelVisible: true, title,
    }));
  };
  mk(t.entry_price, "#2979ff", "Entry", LS.Dotted);
  mk(t.sl_price,     "#e8eaed", "SL",    LS.Dotted);
  mk(t.tp_price,     "#22c55e", "TP",    LS.Dashed);
  // stats bar: ENTRY + R:R (risk = |entry−sl|, reward = |tp−entry|)
  $("sbEntry").textContent = fmtP(t.entry_price);
  $("sbSide").textContent = t.direction === "LONG" ? "▲ LONG" : "▼ SHORT";
  $("sbSide").style.color = t.direction === "LONG" ? "var(--green)" : "var(--red)";
  if (t.tp_price > 0 && t.sl_price > 0) {
    const risk = Math.abs(t.entry_price - t.sl_price);
    const reward = Math.abs(t.tp_price - t.entry_price);
    $("sbRR").textContent = risk > 0 ? (reward / risk).toFixed(1) : "—";
  } else {
    $("sbRR").textContent = "—";  // v5 trades didn't record SL/TP
  }
  $("statsbar").hidden = false;
}

function drawOverlay() {
  const wrap = $("chartwrap");
  const dpr = window.devicePixelRatio||1;
  overlay.width = wrap.clientWidth*dpr; overlay.height = wrap.clientHeight*dpr;
  octx.setTransform(dpr,0,0,dpr,0,0);
  octx.clearRect(0,0,wrap.clientWidth,wrap.clientHeight);
  const ts = chart.timeScale();
  const nowS = Math.floor(Date.now()/1000);
  const list = filtered().slice(-120);                       // perf cap
  if (selTrade) {  // selected trade must always show its zones, even beyond the cap
    const st = (TRADES[curSym]||[]).find(x => x.trade_id === selTrade);
    if (st && !list.includes(st)) list.push(st);
  }
  for (const t of list) {
    const endT = (t.exit_time||nowS) + (t.exit_time?0:900);
    const x1 = ts.timeToCoordinate(t.entry_time), x2 = ts.timeToCoordinate(endT);
    if (x2 === null || x1 === null) { if (x1===null && x2===null) continue; }
    const xa = x1===null?0:x1, xb = x2===null?wrap.clientWidth:x2;
    const P = p => candles.priceToCoordinate(p);
    const isSel = selTrade && t.trade_id === selTrade;
    // Selected trade gets the Gemini-style span rectangle instead of bands —
    // its Entry/SL/TP levels are the dotted price lines from applyReplay().
    if (isSel) {
      const win = t.exit_time && (t.net_pnl || 0) >= 0;
      const loss = t.exit_time && (t.net_pnl || 0) < 0;
      octx.fillStyle = win ? "rgba(34,197,94,.09)" : loss ? "rgba(239,68,68,.09)" : "rgba(41,121,255,.08)";
      octx.fillRect(xa, 0, xb-xa, wrap.clientHeight);
      octx.strokeStyle = win ? "rgba(34,197,94,.5)" : loss ? "rgba(239,68,68,.5)" : "rgba(41,121,255,.5)";
      octx.lineWidth=1; octx.strokeRect(xa, 0, xb-xa, wrap.clientHeight);
    }
    const solid = t.tp_price>0 && t.sl_price>0 && !isSel;
    if (solid) {
      const eY=P(t.entry_price), tpY=P(t.tp_price), slY=P(t.sl_price);
      const lo = Math.min(eY,tpY), hi=Math.max(eY,tpY);
      octx.fillStyle = "rgba(34,197,94,.14)"; octx.fillRect(xa,lo,xb-xa,hi-lo);
      octx.strokeStyle = "rgba(34,197,94,.55)"; octx.lineWidth=1; octx.strokeRect(xa,lo,xb-xa,hi-lo);
      const lo2=Math.min(eY,slY), hi2=Math.max(eY,slY);
      octx.fillStyle = "rgba(239,68,68,.12)"; octx.fillRect(xa,lo2,xb-xa,hi2-lo2);
      octx.strokeStyle = "rgba(239,68,68,.5)"; octx.strokeRect(xa,lo2,xb-xa,hi2-lo2);
      octx.fillStyle = "rgba(231,236,243,.75)"; octx.font="600 10px -apple-system,sans-serif";
      octx.fillText("TP", xb-24, lo-3); octx.fillText("SL", xb-24, hi2+11);
    }
    if (t.fvg_top!=null && t.fvg_bottom!=null) {
      const fx1 = ts.timeToCoordinate(t.entry_time - 3600*2) ?? xa;
      const fy1=P(t.fvg_top), fy2=P(t.fvg_bottom);
      const lo=Math.min(fy1,fy2), hi=Math.max(fy1,fy2);
      octx.fillStyle="rgba(0,206,202,.13)"; octx.fillRect(fx1,lo,xb-fx1,hi-lo);
      octx.strokeStyle="rgba(0,206,202,.5)"; octx.setLineDash([]);
      octx.strokeRect(fx1,lo,xb-fx1,hi-lo);
      octx.fillStyle="rgba(0,206,202,.85)"; octx.fillText("FVG", fx1+5, lo+11);
      octx.setLineDash([]);
    }
    if (t.sweep_price!=null) {
      const sy=P(t.sweep_price);
      const sx1 = ts.timeToCoordinate(t.entry_time-1800) ?? xa;
      octx.strokeStyle="rgba(245,158,11,.8)"; octx.setLineDash([4,4]); octx.lineWidth=1.5;
      octx.beginPath(); octx.moveTo(sx1,sy); octx.lineTo(xb,sy); octx.stroke(); octx.setLineDash([]);
      octx.fillStyle="rgba(245,158,11,.9)"; octx.fillText("SWEEP", sx1+4, sy-4);
    }
  }
}

/* ── sidebar rows ── */
const fmtT = s => s ? new Intl.DateTimeFormat([], {timeZone:TZ, month:"short", day:"2-digit",
                          hour:"2-digit", minute:"2-digit", hour12:false}).format(new Date(s*1000)) : "—";
let dayFmt = new Intl.DateTimeFormat([], {timeZone:TZ, weekday:"short", month:"short", day:"2-digit"});
const fmtP = p => p==null ? "—" : (p>=1000 ? p.toFixed(1) : p.toFixed(4));
function tradeBubbles(t) {
  const dir = t.direction === "LONG";
  const out = [];
  // bubble 1: structural analysis (sweep + FVG) — what the bot "saw"
  if (t.sweep_price != null || (t.fvg_top != null && t.fvg_bottom != null)) {
    const bits = [];
    if (t.sweep_price != null) bits.push(`liquidity swept @ ${fmtP(t.sweep_price)}`);
    if (t.fvg_top != null && t.fvg_bottom != null)
      bits.push(`${dir ? "bullish" : "bearish"} FVG ${fmtP(t.fvg_bottom)}–${fmtP(t.fvg_top)}`);
    out.push(`<div class="bub sys"><div class="av">◆</div><div class="bd">` +
      `<span class="tm">${fmtT(t.entry_time - 120)}</span>` +
      `<span class="anal">${bits.join(" · ")}</span>` +
      `<div class="expl">structural read · ${t.engine || "v5"}</div></div></div>`);
  }
  // bubble 2: entry
  out.push(`<div class="bub"><div class="av">C</div><div class="bd">` +
    `<span class="tm">${fmtT(t.entry_time)}</span>` +
    `<b class="dir ${dir ? "long" : "short"}">${dir ? "▲ LONG" : "▼ SHORT"}</b> @ ${fmtP(t.entry_price)}` +
    `<div class="expl">${t.reason_entry || ""}${t.engine ? " · " + t.engine : ""}</div></div></div>`);
  // bubble 3: exit / live status
  if (t.exit_time) {
    const win = t.status === "WIN_TP_HIT";
    const tag = win ? "TP ✓" : (t.status === "LOSS_SL_HIT" ? "SL ✗" : t.status.replace(/_/g, " "));
    out.push(`<div class="bub"><div class="av">C</div><div class="bd">` +
      `<span class="tm">${fmtT(t.exit_time)}</span>` +
      `<span class="pnl ${(t.net_pnl || 0) >= 0 ? "pos" : "neg"}">${tag} ${(t.net_pnl || 0) >= 0 ? "+" : ""}${(t.net_pnl || 0).toFixed(3)} USDT</span>` +
      `<div class="expl">${t.reason_exit || ""} · exit ${fmtP(t.exit_price)}</div></div></div>`);
  } else if (t.status === "OPEN") {
    out.push(`<div class="bub"><div class="av">C</div><div class="bd">` +
      `<span class="anal">riding… monitoring exit conditions</span></div></div>`);
  }
  return out.join("");
}

function renderRows() {
  const list = filtered().slice().reverse();
  const pnl = (TRADES[curSym]||[]).reduce((a,t)=>a+(t.net_pnl||0),0);
  $("pnlpill").innerHTML = `P&L <b style="color:${pnl>=0?"var(--green)":"var(--red)"}">${pnl>=0?"+":""}${pnl.toFixed(3)} USDT</b>`;
  if (!list.length) {
    $("rows").innerHTML = `<div style="padding:20px;color:var(--dim)">No trades for this filter.</div>`;
    renderMarkers(); return;
  }
  let html = "", lastDay = "";
  for (const t of list) {
    const d = dayFmt.format(new Date(t.entry_time*1000));
    if (d !== lastDay) { html += `<div class="day">${d}</div>`; lastDay = d; }
    html += `<div class="tgroup${t.trade_id === selTrade ? " sel" : ""}" data-tid="${t.trade_id}">` +
            tradeBubbles(t) + `</div>`;
  }
  $("rows").innerHTML = html;
  document.querySelectorAll(".tgroup").forEach(el => el.onclick = () => selectTrade(el.dataset.tid));
  renderMarkers();
}

async function selectTrade(tid) {
  try {
  selTrade = tid;
  const t = (TRADES[curSym]||[]).find(x=>x.trade_id===tid);
  if (!t) return;
  await ensureCandles(t.entry_time, t.exit_time||Math.floor(Date.now()/1000));
  const pad = (t.exit_time||Math.floor(Date.now()/1000)) - t.entry_time < 1800 ? 1800 :
              (t.exit_time - t.entry_time)*0.25;
  // v4 API: setVisibleRange takes {from, to} — the old two-arg v3 form
  // threw inside the async handler and silently killed the zoom.
  chart.timeScale().setVisibleRange({
    from: Math.max(0, t.entry_time - pad),
    to: (t.exit_time || Math.floor(Date.now()/1000)) + pad,
  });
  applyReplay(t);
  renderRows(); drawOverlay();
  if (window.innerWidth<=920) $("aside").classList.remove("open");
  } catch (e) {
    const b = document.getElementById("err");
    if (b) { b.textContent = "Replay error: " + (e.message || e); b.style.display = "block"; }
  }
}

/* ── wiring ── */
$("symbol").onchange = async () => {
  curSym = $("symbol").value; selTrade = null;
  clearReplay();
  candles2m.clear();
  try { await ensureCandles(Math.floor(Date.now()/1000)-86400, Math.floor(Date.now()/1000)); }
  catch(e) {}
  renderRows(); drawOverlay();
};
document.querySelectorAll(".chip").forEach(c => c.onclick = () => {
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
  c.classList.add("on"); filter = c.dataset.f; renderRows(); drawOverlay();
});
$("asidetoggle").onclick = () => $("aside").classList.toggle("open");
$("tz").onchange = () => {
  TZ = $("tz").value; localStorage.setItem("cozy.tz", TZ);
  dayFmt = new Intl.DateTimeFormat([], {timeZone:TZ, weekday:"short", month:"short", day:"2-digit"});
  renderRows(); drawOverlay();
  loadTrades().catch(()=>{});   // refresh "updated" pill in the new tz
};
$("replaybtn").addEventListener("click", () => {
  const list = TRADES[curSym] || [];
  const latest = list[list.length - 1];   // arrays are oldest-first
  const tid = selTrade || (latest ? latest.trade_id : null);
  if (tid) selectTrade(tid);
});
$("sbClear").addEventListener("click", () => {
  selTrade = null; clearReplay(); renderRows(); drawOverlay();
  chart.timeScale().fitContent();
});
chart.timeScale().subscribeVisibleTimeRangeChange(() => requestAnimationFrame(drawOverlay));
new ResizeObserver(() => requestAnimationFrame(drawOverlay)).observe($("chartwrap"));

async function tickLoop() {
  for(;;) {
    try {
      const j = await bitgetFetch("ticker", `symbol=${pairToSymbol(curSym)}`);
      if (j.code==="00000" && j.data[0]) {
        const p = +j.data[0].lastPr;
        candles.setMarkers(markers);  // keep markers after price-line updates
        candles.applyOptions({priceLineVisible:true});
        $("updated").innerHTML = `<span class="dot"></span>${curSym} ${fmtP(p)}`;
      }
    } catch(e){}
    await new Promise(r=>setTimeout(r, 30000));
  }
}

(async function boot(){
  for(;;) {
    try { await loadTrades(); $("err").style.display="none"; break; }
    catch(e) { $("err").style.display="block"; await new Promise(r=>setTimeout(r,5000)); }
  }
  try { await ensureCandles(Math.floor(Date.now()/1000)-86400, Math.floor(Date.now()/1000)); }
  catch(e) { /* ensureCandles no longer throws, but stay defensive */ }
  renderRows(); drawOverlay();
  tickLoop();
  setInterval(loadTrades, 60000);
})();
</script>
