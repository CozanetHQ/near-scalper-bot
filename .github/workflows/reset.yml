name: Reset Account
on:
  workflow_dispatch:
    inputs:
      balance:
        description: "Reset balance to this amount"
        required: false
        default: "3.0"
      reason:
        description: "Why this reset is happening (v4 Sec 10.1 audit requirement)"
        required: true

# Reset touches the same state files the tick engine writes — queue behind
# any running tick, never race it.
concurrency:
  group: tick
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log reset to durable audit record (v4 Section 10.1 — logged, count-limited discipline)
        run: |
          mkdir -p data
          python3 - << 'PY'
          import json, os
          from datetime import datetime, timezone
          entry = {
              "reset_at": datetime.now(timezone.utc).isoformat(),
              "reviewer": "${{ github.actor }}",
              "reason": """${{ github.event.inputs.reason }}""",
              "balance_target": "${{ github.event.inputs.balance }}",
          }
          path = "data/reset_log.jsonl"
          with open(path, "a") as f:
              f.write(json.dumps(entry) + "\n")
          print("logged:", entry)
          PY
      - name: Reset all pair states via the engine's own sync path
        run: |
          pip install requests >/dev/null 2>&1 || true
          python3 - << 'PY'
          import os, importlib.util
          bal = float(os.environ.get("RESET_BAL", "3.0"))
          spec = importlib.util.spec_from_file_location("t", "tick.py")
          t = importlib.util.module_from_spec(spec); spec.loader.exec_module(t)
          # Every pair goes back to its fresh defaults; the shared account
          # restarts at the target balance. The trade ledger is immutable
          # (audit trail) — epoch filtering is by reset timestamp.
          for pair in t.PAIRS:
              su = {**t.fresh_pair_state(pair), "balance": bal, "status": "running"}
              t.sync(pair, state_update=su)
          m = t.load_master()
          print("reset complete — account:", m["account"])
          for p, v in m["pairs"].items():
              print(f"  {p}: positions={v.get('last_error', '[]')[:30]}")
          PY
        env:
          RESET_BAL: ${{ github.event.inputs.balance }}
      - name: Commit reset (audit + state)
        run: |
          git config user.email "fassdavid722@gmail.com"
          git config user.name "CozyCrypto"
          git add data/reset_log.jsonl state/state.json data/trades.jsonl 2>/dev/null || true
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "audit: reset log — ${{ github.event.inputs.reason }}"
          git pull --rebase origin main || true
          git push || echo "push failed, non-fatal"
