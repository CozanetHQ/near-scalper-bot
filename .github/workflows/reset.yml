name: Reset Account
on:
  workflow_dispatch:
    inputs:
      balance:
        description: "Reset balance to this amount"
        required: false
        default: "3.0"
      reason:
        description: "Why this reset is happening (v4 Sec 10.1 audit requirement)"
        required: true

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log reset to durable audit record (v4 Section 10.1 — logged, count-limited discipline)
        run: |
          mkdir -p data
          python3 - << 'PY'
          import json, os
          from datetime import datetime, timezone
          entry = {
              "reset_at": datetime.now(timezone.utc).isoformat(),
              "reviewer": "${{ github.actor }}",
              "reason": """${{ github.event.inputs.reason }}""",
              "balance_target": "${{ github.event.inputs.balance }}",
          }
          path = "data/reset_log.jsonl"
          with open(path, "a") as f:
              f.write(json.dumps(entry) + "\n")
          print("logged:", entry)
          PY
      - name: Commit audit record
        run: |
          git config user.email "fassdavid722@gmail.com"
          git config user.name "CozyCrypto"
          git add data/reset_log.jsonl
          git commit -m "audit: reset log — ${{ github.event.inputs.reason }}" || echo "nothing to commit"
          git push || echo "push failed, non-fatal"
      - name: Reset account state via the engine's own sync path
        run: |
          python3 - << 'PY'
          import os, urllib.request, json
          bal = float(os.environ.get("RESET_BAL", "3.0"))
          state = {
              "balance": bal, "position_open": False, "side": "none",
              "entry_price": 0.0, "tp_price": 0.0, "sl_price": 0.0,
              "notional": 0.0, "margin": 0.0,
              "total_trades": 0, "wins": 0, "losses": 0,
              "streak_count": 0, "streak_side": "none",
              "open_positions": 0, "unrealized_pnl": 0.0, "equity": bal,
              "last_error": "",
              "last_reversal_at": "",
              "last_price": 0.0,
              "last_tick_at": "",
          }
          for i in range(8):
              state[f"pos_{i}_active"] = False
              state[f"pos_{i}_side"] = "none"
              state[f"pos_{i}_entry_price"] = 0.0
              state[f"pos_{i}_tp_price"] = 0.0
              state[f"pos_{i}_notional"] = 0.0
              state[f"pos_{i}_margin"] = 0.0
              state[f"pos_{i}_opened_at"] = ""
          # exactly the payload shape tick.py sends: {"state": ..., "trade": None}
          data = json.dumps({"state": state, "trade": None}).encode()
          req = urllib.request.Request(
              "https://superagent-ae0aaf02.base44.app/functions/nearScalperSync",
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36",
                  "Accept": "application/json, text/plain, */*",
                  "X-Tick-Secret": os.environ["TICK_SECRET"],
              },
              method="POST")
          print(urllib.request.urlopen(req, timeout=15).read().decode())
          PY
        env:
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
          RESET_BAL: ${{ github.event.inputs.balance }}
