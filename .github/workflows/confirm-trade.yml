name: Confirm Trade
on:
  workflow_dispatch: {}

# One confirmation trade at a time; a re-dispatch replaces an older run.
concurrency:
  group: confirm-trade
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run one-shot confirmation trade
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BITGET_DEMO: '0'
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_SECRET: ${{ secrets.BITGET_SECRET }}
          BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
          LIVE_MARGIN_USD: '3'
          LIVE_MAX_NOTIONAL: '50'
        run: python3 scripts/confirm_trade.py
