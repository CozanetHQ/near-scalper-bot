name: Network Diagnostics
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Health checks (multi-pair era)
        run: |
          for S in NEARUSDT BTCUSDT ETHUSDT SOLUSDT XRPUSDT; do
            echo "--- Bitget candles $S ---"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" "https://api.bitget.com/api/v2/mix/market/candles?symbol=$S&productType=USDT-FUTURES&granularity=1m&limit=3"
          done
          echo "--- Bitget tickers (all pairs) ---"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" "https://api.bitget.com/api/v2/mix/market/tickers?productType=USDT-FUTURES"
          echo "--- Engine state file ---"
          if [ -f state/state.json ]; then
            python3 -c "import json; m=json.load(open('state/state.json')); print('updated_at:', m.get('updated_at')); print('account:', m.get('account')); print('pairs:', list((m.get('pairs') or {}).keys()))"
          else
            echo "state/state.json MISSING (first tick has not run yet)"
          fi
          echo "--- Telegram API ---"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" "https://api.telegram.org"
