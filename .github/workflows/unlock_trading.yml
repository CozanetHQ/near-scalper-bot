name: Unlock Trading
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why you're clearing the circuit breaker (Sec 5.2 audit requirement)"
        required: true

# Owner spec 2026-09-17, Master Architecture Sec 5.2 (Losing-Streak Circuit
# Breaker). The bot NEVER clears this on its own — no timer, no session-block
# rollover. Only this manual, founder-authenticated workflow can.
#
# Queues behind any running tick (never races position/account state).
concurrency:
  group: tick
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clear the circuit breaker
        env:
          UNLOCK_REASON: ${{ github.event.inputs.reason }}
          UNLOCK_ACTOR: ${{ github.actor }}
        run: python3 scripts/unlock_trading.py
      - name: Commit unlock (state + audit log)
        run: |
          git config user.email "fassdavid722@gmail.com"
          git config user.name "CozyCrypto"
          git add data state 2>/dev/null || true
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "unlock: circuit breaker cleared — ${{ github.event.inputs.reason }}"
          git pull --rebase origin main || true
          git push || echo "push failed, non-fatal"
