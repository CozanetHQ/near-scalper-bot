name: Probe State Round-trip
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test long-string round-trip through last_error
        run: |
          python3 - << 'PY'
          import os, urllib.request, json
          SEC = os.environ["TICK_SECRET"]
          SYNC = "https://superagent-ae0aaf02.base44.app/functions/nearScalperSync"
          DASH = "https://superagent-ae0aaf02.base44.app/functions/nearScalperDashboard"
          pos = [{"s":"long","e":2.3901,"t":2.3971,"n":3.85,"m":0.385,"o":"2026-09-06T13:55:00+00:00"} for _ in range(8)]
          blob = json.dumps(pos, separators=(",", ":"))
          state = {"balance": 3.0, "position_open": True, "last_error": blob}
          req = urllib.request.Request(SYNC, data=json.dumps({"state": state, "trade": None}).encode(),
              headers={"Content-Type": "application/json", "User-Agent": "Mozilla/5.0",
                       "X-Tick-Secret": SEC}, method="POST")
          print("SYNC RESP:", urllib.request.urlopen(req, timeout=15).read().decode()[:300])
          req2 = urllib.request.Request(DASH, headers={"User-Agent": "Mozilla/5.0"})
          st = (json.loads(urllib.request.urlopen(req2, timeout=15).read().decode()).get("state") or {})
          got = st.get("last_error")
          print(f"SENT len={len(blob)} GOT len={len(got) if got else None} MATCH={got == blob}")
          if got != blob:
              print("GOT:", repr(got)[:400])
          # cleanup: clear last_error
          state2 = {"last_error": "", "position_open": False, "side": "none"}
          req3 = urllib.request.Request(SYNC, data=json.dumps({"state": state2, "trade": None}).encode(),
              headers={"Content-Type": "application/json", "User-Agent": "Mozilla/5.0",
                       "X-Tick-Secret": SEC}, method="POST")
          urllib.request.urlopen(req3, timeout=15).read()
          print("cleanup done")
          PY
        env:
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
