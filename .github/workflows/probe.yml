name: Probe State Round-trip
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Write fake position, then read it back
        run: |
          python3 - << 'PY'
          import os, urllib.request, json
          SEC = os.environ["TICK_SECRET"]
          SYNC = "https://superagent-ae0aaf02.base44.app/functions/nearScalperSync"
          DASH = "https://superagent-ae0aaf02.base44.app/functions/nearScalperDashboard"
          now = "2026-09-06T13:55:00+00:00"
          state = {
              "balance": 3.0, "position_open": True, "side": "long",
              "entry_price": 2.3900, "tp_price": 2.4000, "sl_price": 0.0,
              "notional": 3.0, "margin": 0.3, "opened_at": now,
              "open_positions": 1, "unrealized_pnl": 0.01, "equity": 3.01,
              "pos_0_active": True, "pos_0_side": "long", "pos_0_entry_price": 2.39,
              "pos_0_tp_price": 2.40, "pos_0_notional": 3.0, "pos_0_margin": 0.3,
              "pos_0_opened_at": now,
              "probe_field": "CAN_YOU_SEE_ME",
          }
          req = urllib.request.Request(SYNC, data=json.dumps({"state": state, "trade": None}).encode(),
              headers={"Content-Type": "application/json", "User-Agent": "Mozilla/5.0",
                       "X-Tick-Secret": SEC}, method="POST")
          print("SYNC RESP:", urllib.request.urlopen(req, timeout=15).read().decode()[:500])
          # read back
          req2 = urllib.request.Request(DASH, headers={"User-Agent": "Mozilla/5.0"})
          got = json.loads(urllib.request.urlopen(req2, timeout=15).read().decode())
          st = got.get("state") or {}
          print("READBACK KEYS:", sorted(st.keys()))
          for k in ("pos_0_active", "pos_0_side", "open_positions", "equity", "unrealized_pnl", "probe_field", "position_open"):
              print(f"  {k} = {st.get(k)!r}")
          PY
        env:
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
