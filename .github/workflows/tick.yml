name: NEAR Scalper Tick
on:
  schedule:
    # Watchdog: hourly at :07 in case the perpetual chain breaks
    - cron: '7 * * * *'
  workflow_dispatch:

# Only one tick engine may run at a time; a new run replaces an older one.
# This prevents double-opening positions from two concurrent pollers.
concurrency:
  group: tick
  cancel-in-progress: true

permissions:
  actions: write
  contents: write   # the engine's state (state/state.json) is committed every run

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tick engine (multi-pair)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_RUNTIME: '240'
          # Sovereign v6 (owner 2026-09-15): NEAR runs the new top-down MTF
          # engine; the other pairs keep v5 untouched.
          SOVEREIGN_V6: '1'
          # ALL-PAIRS PROMOTION (owner 2026-09-18 ~08:50 Lagos): every pair
          # runs sovereign v6 — live execution only exists in the sovereign
          # engine, so "all live" requires all sovereign. ETH/SOL/XRP open v5
          # paper positions were force-closed first (PROMOTION_FORCE_CLOSE in
          # the ledger) — sovereign cannot manage a v5 position.
          # NOTE: ETH/SOL/XRP have no sovereign v6 track record yet; BTC was
          # +0.478 paper, ETH was -2.04 on v5 paper. Auto-fallback covers the
          # shared $4 wallet: pairs whose probe finds equity < MIN_LIVE_EQUITY
          # trade Bitget demo until the wallet can fund them.
          SOVEREIGN_PAIRS: 'NEARUSDT,BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT'
          # ── LIVE TRADING (owner 2026-09-15) ──
          # AUTO-FALLBACK (owner 2026-09-15): with BITGET_DEMO='0', if the
          # live wallet equity < MIN_LIVE_EQUITY the pair trades Bitget demo
          # instead and re-probes the live wallet every LIVE_RECHECK_MINUTES
          # until it can fund trades again (then auto-switches back).
          LIVE_TRADING: '1'
          # ALL PAIRS LIVE (owner 2026-09-18): NEAR+BTC+ETH+SOL+XRP. Each
          # entry commits $3 at 10x off the shared real wallet; pairs the
          # wallet can't fund auto-fall back to Bitget demo per the rule above.
          LIVE_PAIRS: 'NEARUSDT,BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT'
          LIVE_MAX_NOTIONAL: '50'
          # OWNER 09-17 ($4 live start): entries commit $3 cash at 10x; live
          # floor lowered from $10 so the $4 wallet trades REAL, not demo.
          LIVE_MARGIN_USD: '3'
          MIN_LIVE_EQUITY: '3.5'
          LIVE_RECHECK_MINUTES: '60'
          # ── Manual Position Auto-Management (owner spec 2026-09-18) ──
          # DEFAULT OFF (detect + Telegram alert only, no TP placement).
          # Runtime override lives in data/manual_manager.json config block
          # (set via scripts/set_manual_manager.py / manual-manager.yml).
          AUTO_MANAGE_MANUAL_POSITIONS: '0'
          MANUAL_MANAGER_KILL_SWITCH: '0'
          BITGET_DEMO: '0'
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_SECRET: ${{ secrets.BITGET_SECRET }}
          BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
        run: |
          echo "Starting multi-pair scalper tick engine..."
          python tick.py

      - name: Regenerate no-JS static chart
        run: |
          # owner's mobile network strips/blocks JS+CDNs — this bakes candles
          # and trades into pure HTML+SVG so the dashboard renders anywhere
          python lab/gen_static_chart.py || echo "static chart regen failed (non-blocking)"

      - name: Commit engine state
        run: |
          # The repo IS the state store: git history is the audit trail and
          # raw.githubusercontent is the public dashboard feed.
          git config user.email "fassdavid722@gmail.com"
          git config user.name "CozyCrypto"
          git add state data 2>/dev/null || true   # add dirs, not paths: git add is all-or-nothing if a listed file is absent (no trades yet)
          if git diff --cached --quiet; then echo "no state change"; exit 0; fi
          git commit -m "state: multi-pair tick $(date -u +%FT%TZ)"
          git pull --rebase origin main || true
          git push || echo "push failed — next tick will retry with rebase"

      - name: Chain next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Perpetual chain: dispatch the next run immediately so the bot
          # wakes ~every 5 min (scalper cadence). Hourly cron is the watchdog.
          gh api -X POST repos/CozanetHQ/near-scalper-bot/actions/workflows/tick.yml/dispatches -f ref=main && echo "Chained next run" || echo "Chain dispatch failed (watchdog cron will recover)"
