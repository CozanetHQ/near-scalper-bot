name: NEAR Scalper Tick
on:
  schedule:
    # Hourly at :07 (GitHub throttles top-of-hour schedules; offset improves reliability)
    - cron: '7 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 52
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tick engine
        env:
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_RUNTIME: '2900'
        run: |
          echo "Starting NEAR scalper tick engine (hourly long-run)..."
          python tick.py
          echo "Tick run finished with exit code $?"
