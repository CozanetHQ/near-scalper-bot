name: NEAR Scalper Tick
on:
  schedule:
    # Watchdog: hourly at :07 in case the perpetual chain breaks
    - cron: '7 * * * *'
  workflow_dispatch:

# Only one tick engine may run at a time; a new run replaces an older one.
# This prevents double-opening positions from two concurrent pollers.
concurrency:
  group: tick
  cancel-in-progress: true

permissions:
  actions: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tick engine
        env:
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_RUNTIME: '240'
        run: |
          echo "Starting NEAR scalper tick engine..."
          python tick.py

      - name: Chain next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Perpetual chain: dispatch the next run immediately so the bot
          # wakes ~every 5 min (scalper cadence). Hourly cron is the watchdog.
          gh api -X POST repos/CozanetHQ/near-scalper-bot/actions/workflows/tick.yml/dispatches -f ref=main && echo "Chained next run" || echo "Chain dispatch failed (watchdog cron will recover)"
